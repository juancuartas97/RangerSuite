<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Detail</title>
    <style>
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --border: #e2e7f0;
  --text: #18233a;
  --muted: #76839a;
  --navy: #0c1b63;
  --navy-soft: #2f3d7b;
  --row: #f8fafc;
}

* { box-sizing: border-box; }
html, body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }

.topbar {
  height: 68px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}
.menu-icon { color: #909db5; font-size: 1.2rem; }
.user-meta { display: flex; align-items: center; gap: 16px; color: var(--navy); font-weight: 700; }

.page { padding: 18px; }
.page h1 { margin: 0 0 14px; font-size: 2rem; }

.tabs { display: flex; gap: 10px; margin-bottom: 14px; }
.tab {
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 9px 14px;
  font-weight: 700;
  color: #223467;
}
.tab.active { background: var(--navy); color: #fff; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.title-line { display: flex; align-items: baseline; gap: 10px; }
.title-line h2 { margin: 0; font-size: 1.9rem; }
.title-line span { color: var(--muted); font-weight: 600; }

.search {
  width: min(760px, 100%);
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #f4f7fc;
  padding: 10px 14px;
}

.btn-primary {
  border: 1px solid var(--navy-soft);
  background: var(--navy-soft);
  color: #fff;
  border-radius: 8px;
  padding: 9px 16px;
  font-weight: 700;
}

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { border-bottom: 1px solid var(--border); padding: 13px 14px; text-align: left; }
.table th { color: #263f77; font-size: 0.95rem; }
.table td { color: #4f6282; }
.table td.role { color: #2f477f; font-weight: 700; }

.footer-pager {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  color: #2c416f;
  font-weight: 700;
}

.btn-muted {
  border: 1px solid var(--border);
  background: #f8fbff;
  color: #8392aa;
  border-radius: 8px;
  padding: 8px 14px;
  font-weight: 700;
}

.form-wrap { padding: 16px; }
.form-grid { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.form-row {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 20px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: #fff;
}
.form-row:last-child { border-bottom: 0; }
.form-row label { color: #253d73; font-weight: 700; }
.form-row .hint { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
.field, .select {
  width: 100%;
  border: 1px solid #cfd8e8;
  background: #f4f7fc;
  border-radius: 6px;
  min-height: 40px;
  padding: 9px 12px;
}

.action-bar { display: flex; justify-content: flex-end; gap: 10px; margin: 0 0 12px; }

.audit-title { margin: 14px 0 0; font-size: 2rem; }

@media (max-width: 1100px) {
  .section-head { flex-direction: column; align-items: stretch; }
  .form-row { grid-template-columns: 1fr; gap: 10px; }
}


.inline-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.check-matrix {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 16px;
  color: #324d85;
  font-weight: 600;
}

.check-matrix label {
  display: flex;
  align-items: center;
  gap: 8px;
}

@media (max-width: 1100px) {
  .inline-grid-2,
  .check-matrix {
    grid-template-columns: 1fr;
  }
}

</style>
  </head>
  <body>
    <header class="topbar">
      <span class="menu-icon">☰</span>
      <div class="user-meta"><span>🔔</span><span>Super User</span></div>
    </header>

    <main class="page">
      <div class="action-bar">
        <button class="btn-muted">Delete User</button>
        <button class="btn-muted">Unblock User</button>
        <button class="btn-muted">Copy User</button>
        <button class="btn-primary">Submit</button>
      </div>

      <h1>User Profile</h1>

      <section class="panel form-wrap">
        <div class="form-grid">
          <div class="form-row"><label>ID</label><input class="field" value="1364" /></div>
          <div class="form-row"><label>User ID</label><input class="field" value="sayala" /></div>
          <div class="form-row"><label>Demo Lookup Count</label><input class="field" value="-1" /></div>
          <div class="form-row"><label>Mr/Ms/Dr</label><input class="field" /></div>
          <div class="form-row"><label>First Name</label><input class="field" value="Stephanie" /></div>
          <div class="form-row"><label>Last Name</label><input class="field" value="Ayala" /></div>
          <div class="form-row"><label>Telephone</label><input class="field" /></div>
          <div class="form-row"><label>Email</label><input class="field" value="sayala@ecgmc.com" /></div>
          <div class="form-row"><label>Contact Info</label><input class="field" value="elamontagne@rchsd.org" /></div>
          <div class="form-row"><label>Subscriber</label><select class="select"><option>MD Ranger Customer Use Only</option></select></div>
          <div class="form-row"><label>Role</label><select class="select"><option>MDR Staff</option></select></div>
          <div class="form-row"><label>State</label><input class="field" /></div>

          <div class="form-row">
            <label>Regional Benchmarks</label>
            <select class="select" multiple style="min-height:140px;">
              <option>All Acute Hospitals</option>
              <option>All Facility Types</option>
              <option>All Acute Trauma</option>
              <option>All Acute Non-Trauma</option>
              <option>All Facilities Trauma</option>
            </select>
          </div>

          <div class="form-row">
            <label>Permissions</label>
            <div class="check-matrix">
              <label><input type="checkbox" checked /> DataTool?</label>
              <label><input type="checkbox" checked /> Edit?</label>
              <label><input type="checkbox" checked /> Certify?</label>
              <label><input type="checkbox" checked /> Invalidate?</label>
              <label><input type="checkbox" checked /> Notify?</label>
              <label><input type="checkbox" checked /> 90th Percentile?</label>
              <label><input type="checkbox" /> Analytics/Custom BM Rpt?</label>
            </div>
          </div>
        </div>
      </section>

      <div style="margin-top:12px;"><button class="btn-primary">Spoof as sayala</button></div>
    </main>
  </body>
</html>
