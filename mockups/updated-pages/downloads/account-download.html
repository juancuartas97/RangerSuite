<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <style>
:root {
  --navy: #05145f;
  --teal: #1fb6cc;
  --page-bg: #ecf2f8;
  --surface: #ffffff;
  --line: #d9e2ee;
  --text: #1f2a3d;
  --muted: #66758d;
  --soft: #f5f8fc;
  --shadow: 0 14px 34px rgba(10, 34, 90, 0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page-bg);
  color: var(--text);
}

a { text-decoration: none; color: inherit; }
input, button, select { font: inherit; }

.top-nav {
  background: var(--navy);
  color: #fff;
  min-height: 82px;
  display: grid;
  grid-template-columns: 210px 1fr auto;
  align-items: center;
  gap: 28px;
  padding: 0 24px;
}

.logo {
  font-size: 2.1rem;
  font-weight: 300;
  letter-spacing: -0.04em;
}
.logo span { font-weight: 600; }
.logo-sub {
  margin-top: -5px;
  font-size: 0.7rem;
  opacity: 0.8;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 30px;
  font-weight: 600;
}
.nav-links a { opacity: 0.9; }
.nav-links a.active { border-bottom: 3px solid #2ad1e7; padding-bottom: 6px; }

.user-actions {
  display: flex;
  align-items: center;
  gap: 20px;
  font-weight: 600;
}

.hero-band {
  background: var(--teal);
  min-height: 112px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.search {
  width: min(780px, 100%);
  border: 1px solid #adcdd7;
  border-radius: 4px;
  padding: 12px 16px;
  background: #fff;
}

.page-wrap {
  width: min(1180px, calc(100% - 48px));
  margin: 24px auto 44px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
}

.section-title {
  font-size: 2rem;
  margin: 0 0 18px;
  letter-spacing: -0.02em;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  margin-bottom: 26px;
}

.quick-card {
  min-height: 130px;
  display: grid;
  place-items: center;
  font-weight: 700;
  color: #2f4f9e;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 26px;
}

.video-item h3 {
  margin: 0 0 8px;
  font-size: 1.75rem;
  letter-spacing: -0.02em;
}
.video-thumb {
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  background: linear-gradient(180deg, #5277ca 0%, #0f1f4f 100%);
  border: 1px solid #8ea8df;
  position: relative;
}
.video-thumb::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,.12));
}
.video-thumb::after {
  content: "▶";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 84px;
  height: 84px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 2.1rem;
  border: 4px solid rgba(255,255,255,.8);
}

.form-page { width: min(980px, calc(100% - 48px)); margin: 28px auto 50px; }
.form-card { padding: 28px; }
.row { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: start; padding: 10px 0; }
.row + .row { border-top: 1px solid var(--line); }
.label { font-weight: 700; }
.help { color: var(--muted); font-size: .9rem; }
.text-field, .select-field {
  width: 100%;
  border: 1px solid #bec9db;
  background: #fff;
  border-radius: 6px;
  min-height: 40px;
  padding: 10px 12px;
}

.choice-wrap {
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  display: grid;
  gap: 10px;
}

.check-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px 20px; }

.page-title { font-size: 2.4rem; margin: 0 0 8px; letter-spacing: -0.03em; }
.subtle { margin: 0; color: var(--muted); }

.chart-shell {
  margin-top: 24px;
  padding: 20px;
}

.bar-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.bar-table th, .bar-table td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
.bar-table th { color: var(--muted); font-size: .9rem; }

@media (max-width: 1000px) {
  .top-nav { grid-template-columns: 1fr; gap: 10px; padding: 14px 16px; }
  .nav-links { flex-wrap: wrap; gap: 14px; }
  .quick-grid, .video-grid { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr; }
  .check-grid { grid-template-columns: 1fr; }
}

</style>
  </head>
  <body>
    <header class="top-nav">
      <div>
        <div class="logo">MD<span>RANGER</span></div>
        <div class="logo-sub">Powered by ECG</div>
      </div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">Benchmarks</a>
        <a href="documentation.html">Documentation</a>
        <a href="#">Contracts</a>
        <a href="#">Trends</a>
      </nav>
      <div class="user-actions">
        <span>jcuartas</span>
        <span>Help</span>
      </div>
    </header>

    <main class="form-page">
      <section class="card form-card">
        <h1 class="section-title">Account</h1>

        <div class="row">
          <div>
            <div class="label">Organization</div>
          </div>
          <div>MD Ranger Customer Use Only</div>
        </div>

        <div class="row">
          <div class="label">First Name</div>
          <div><input class="text-field" value="Juan" /></div>
        </div>

        <div class="row">
          <div class="label">Last Name</div>
          <div><input class="text-field" value="Cuartas" /></div>
        </div>

        <div class="row">
          <div class="label">Telephone</div>
          <div><input class="text-field" placeholder="Enter telephone" /></div>
        </div>

        <div class="row">
          <div class="label">Email</div>
          <div><input class="text-field" placeholder="Enter email" /></div>
        </div>

        <div class="row">
          <div>
            <div class="label">Preferences</div>
            <p class="help">Search</p>
          </div>
          <div>
            <div style="display:grid; gap:10px; margin-bottom:12px;">
              <label><input type="radio" name="search" checked /> Default: All Benchmarks</label>
              <label><input type="radio" name="search" /> Customize Benchmarks</label>
            </div>

            <div class="choice-wrap">
              <label><input type="radio" name="facility" /> Display facility characteristic benchmarks</label>
              <div class="check-grid">
                <label><input type="checkbox" /> All Hospitals</label>
                <label><input type="checkbox" checked /> Trauma Status</label>
                <label><input type="checkbox" checked /> Bed Size</label>
                <label><input type="checkbox" checked /> Urban/Rural</label>
                <label><input type="checkbox" checked /> ADC</label>
                <label><input type="checkbox" checked /> Teaching Status</label>
              </div>

              <label><input type="radio" name="facility" /> Match my Facility</label>
              <select class="select-field">
                <option>Select facility</option>
                <option>Primary Hospital</option>
                <option>Regional Center</option>
              </select>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="label">Rate Comparison Report</div>
          <div style="display:grid; gap:8px;">
            <label><input type="radio" name="rate" /> 50th percentile</label>
            <label><input type="radio" name="rate" checked /> 75th percentile</label>
            <label style="margin-top:6px;"><input type="checkbox" checked /> Automatically archive expired arrangements in Contracts</label>
          </div>
        </div>

        <div class="row">
          <div class="label">Change Password</div>
          <div style="display:grid; gap:10px;">
            <input class="text-field" type="password" placeholder="Current password" />
            <input class="text-field" type="password" placeholder="New password" />
            <input class="text-field" type="password" placeholder="Confirm password" />
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:4px;">
              <button style="padding:10px 14px; border:1px solid #bac8dd; border-radius:6px; background:#fff;">Cancel</button>
              <button style="padding:10px 14px; border:1px solid #031254; border-radius:6px; background:#031254; color:#fff;">Save</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
